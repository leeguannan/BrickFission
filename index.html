<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>碎砖大裂变 · Brick Fission</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2308102e'/%3E%3Crect x='12' y='14' width='18' height='14' rx='2' fill='%23ef1d1d'/%3E%3Crect x='34' y='14' width='18' height='14' rx='2' fill='%23ffb800'/%3E%3Crect x='12' y='34' width='18' height='14' rx='2' fill='%2300c82a'/%3E%3Crect x='34' y='34' width='18' height='14' rx='2' fill='%237d8594'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./src/app/styles.css" />
  </head>
  <body>
    <div id="app-root">
      <div id="stage-frame">
        <canvas id="game-canvas" width="720" height="1280" aria-label="碎砖大裂变游戏画布"></canvas>

        <!-- 顶部栏：DOM 实现，点击事件与画布控板严格隔离 -->
        <div id="top-bar" class="ui-layer">
          <div class="top-group left">
            <button id="btn-speed" class="icon-btn" type="button" aria-label="快进倍率">1x</button>
            <button id="btn-restart" class="icon-btn" type="button" aria-label="重开">↻</button>
            <button id="btn-studio" class="icon-btn" type="button" aria-label="关卡工作台">🛠</button>
          </div>
          <div class="top-group center">
            <span id="level-dot" class="level-dot"></span>
            <span id="level-no" class="level-no">01</span>
          </div>
          <div class="top-group right">
            <span class="coin-chip" aria-label="金币数"><span class="coin-icon">🪙</span><span id="coin-count">0</span></span>
            <button id="btn-shop" class="icon-btn" type="button" aria-label="皮肤商店">🛍</button>
            <button id="btn-sound" class="icon-btn" type="button" aria-label="静音开关">♪</button>
            <button id="btn-pause" class="icon-btn" type="button" aria-label="暂停">||</button>
          </div>
        </div>

        <!-- Milestone 5 / Step 2：Fever 能量条（精准接球累积，满 100 触发暴走） -->
        <div id="fever-bar" class="ui-layer fever-bar" aria-label="Fever 能量条">
          <div id="fever-fill" class="fever-fill"></div>
          <span id="fever-label" class="fever-label">FEVER</span>
        </div>

        <!-- 左侧技能列 -->
        <div id="skill-column" class="ui-layer">          <button id="btn-skill-blue" class="skill-btn blue" type="button" aria-label="蓝标连发">
            <span class="skill-glyph dots-h">●●●</span>
            <span id="skill-blue-count" class="skill-count">0</span>
          </button>
          <button id="btn-skill-orange" class="skill-btn orange" type="button" aria-label="橙标分裂">
            <span class="skill-glyph tri">●<br />●●</span>
            <span id="skill-orange-count" class="skill-count">0</span>
          </button>
        </div>

        <!-- 底部控制行：选关 / 皮肤 -->
        <div id="bottom-bar" class="ui-layer">
          <select id="level-select" aria-label="选择测试关"></select>
          <select id="skin-select" aria-label="挡板皮肤"></select>
        </div>

        <!-- 通用弹窗（结算 / 模拟激励广告） -->
        <div id="modal-mask" class="modal-mask hidden">
          <div id="modal-card" class="modal-card">
            <h2 id="modal-title"></h2>
            <p id="modal-body"></p>
            <div id="modal-actions" class="modal-actions"></div>
          </div>
        </div>

        <!-- 皮肤商店（docs/04 §3.1 商业化循环 ③） -->
        <div id="shop-panel" class="shop-panel hidden"></div>
      </div>
    </div>
    <script type="module" src="./src/app/main.ts"></script>
  </body>
</html>
